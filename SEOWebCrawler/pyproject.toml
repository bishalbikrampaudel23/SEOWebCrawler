[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-web-crawler"
version = "0.1.0"
description = "A bounded, robots-aware website SEO analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "Flask>=3.1,<4",
  "nltk>=3.9,<4",
  "PyYAML>=6,<7",
  "requests>=2.32.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<7", "ruff>=0.11,<1", "Sphinx>=8.2,<9"]
server = ["gunicorn>=23,<24"]

[project.scripts]
seo-analyze = "seowebcrawler.cli:main"

[tool.setuptools.packages.find]
include = ["seowebcrawler*"]

[tool.setuptools.package-data]
seowebcrawler = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"